# ===== tmux 設定 (devbox セッション層: issue #214 Phase 1) =====
# どのクライアント (WezTerm / 素の ssh / iPad) から入っても
# `tmux new -As main` で同一セッションに attach する運用の土台。

# --- 基本 ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # truecolor
# ESC 遅延はほぼゼロに (nvim 用)。ただし 0 にすると SSH 越しに分割着信した
# エスケープシーケンス (DA 応答やマウスイベント) が生テキストとして
# シェルに漏れるため、わずかに待つ。
set -s escape-time 10
set -g history-limit 100000
# Claude Code のプロンプト枠をクリックしただけで罫線 (─) がクリップボードに
# 入る誤爆が多いため off (2026-08-22)。ドラッグ選択は WezTerm ネイティブ選択 +
# Ctrl+Shift+C、履歴スクロールは prefix [ の copy-mode を使う。
# 注意: off の間は iPad/Termius のタッチ操作・クリックでのペイン移動・
# ドラッグ即コピー (MouseDragEnd1Pane 等のバインドは残置、単に発火しない) も無効。
set -g mouse off
set -g focus-events on                      # nvim の autoread 等に必要
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- OSC パススルー ---
# claude_notify の SetUserVar (OSC 1337) や OSC 7 (cwd 通知) を
# tmux 越しに WezTerm まで透過させる。マルチクライアント同期の要。
# on だと「通知元ペインが表示中のときだけ」通す (tmux 3.4 man)。背景ウィンドウの
# Claude Code の通知は握りつぶされる一方 notify.sh は attach を見て ntfy にも
# 落とさないため、どこにも通知が出なくなる。必ず all にする。
set -g allow-passthrough all
set -g set-clipboard on
# アプリが OSC 8 で明示したハイパーリンクを WezTerm までそのまま通す (tmux 3.4+)。
# OSC 8 のリンクはセル属性なので、折り返していても 1 本のリンクとしてクリックできる
set -as terminal-features '*:hyperlinks'

# --- prefix ---
# prefix は C-q。WezTerm の LEADER と同じキーにして「どこでも Ctrl+q」に揃える。
# ただし WezTerm 上では Ctrl+q は WezTerm 自身が LEADER として食うため tmux まで
# 届かない (.wezterm.lua の config.leader)。WezTerm からは LEADER + キーの
# ブリッジ経由で tmux のキーが飛ぶ。この C-q が直接効くのは iPad/Termius/素の ssh 等、
# WezTerm 以外のクライアントから入ったとき。
# C-b も prefix2 として残す: .wezterm.lua の tmux_bridge が \x02 (C-b) を送る
# 実装なので、これを外すと WezTerm 側のショートカットが全滅する。
set -g prefix C-q
set -g prefix2 C-b
bind C-q send-prefix

# --- ペイン操作 ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# ウィンドウ/ペインを確認なしで閉じる (WezTerm の Ctrl+w / LEADER+x からブリッジ。
# 既定の y/n 確認を外す)
# ウィンドウは閉じる前に構成 (名前/レイアウト/各ペインの cwd・@name・claude 会話 ID) を
# 記録し、prefix + W (WezTerm の Ctrl+Shift+w) で開き直せるようにする。ブラウザの
# 「タブを閉じる/閉じたタブを開き直す」と同じ操作感。連打で閉じた順に遡れる
bind & run-shell "sh ~/.local/bin/tmux-close-window close '#{window_id}'"
bind W run-shell "sh ~/.local/bin/tmux-close-window undo"
# prefix + x x : ペインを閉じる (x の 2 連打)。1 回目は閉じるモードに入るだけで、
# 続けて x を押したときだけ閉じる。隣の z (ズーム) と押し間違えても実害が出ないように
# するための 2 段構え (issue #242)。x 以外のキーを押せば取り消してそのキーが素通りする。
# 閉じる前に構成 (cwd / @name / claude 会話 ID / レイアウト) を記録し、prefix + X で
# 開き直せる。ウィンドウ最後の 1 枚のときはウィンドウごと閉じる扱いになり、
# 記録も復元も tmux-close-window (prefix + W) 側に回る
bind x switch-client -T closepane \; display-message "もう一度 x でこのペインを閉じる (他のキーで取消)"
bind -T closepane x run-shell "sh ~/.local/bin/tmux-close-pane close '#{pane_id}'"
bind X run-shell "sh ~/.local/bin/tmux-close-pane undo"
# Alt+矢印でプレフィックスなしペイン移動。
# 左右は端で行き止まりにせず隣のウィンドウ (タブ) へ抜ける:
#   一番左のペインで Alt+Left  → 前のウィンドウの一番右のペイン
#   一番右のペインで Alt+Right → 次のウィンドウの一番左のペイン
# ウィンドウ端でも previous-window / next-window が巻き戻るので、押し続けると
# 全ウィンドウの全ペインを一周できる (ブラウザのタブを跨いだフォーカス移動と同じ感覚)。
# 移動先は tmux が指定できる角のペイン ({bottom-right} / {top-left}) なので、
# 右列が上下分割されているウィンドウに左から入ると下側のペインに着く。
# 上下は端でセッションを跨ぐ (左右がタブ軸、上下がセッション軸):
#   一番上のペインで Alt+Up   → 前のセッションの一番下のペイン
#   一番下のペインで Alt+Down → 次のセッションの一番上のペイン
# セッションの並びは名前順 (01- 02- の番号)。Alt+K/J の巡回と同じ順。
# switch-client の直後の select-pane は切り替え前のセッションに当たってしまうため、
# 上下だけは tmux-nav-session に出している (理由はスクリプト冒頭のコメント)。
bind -n M-Left  if -F '#{pane_at_left}'  "previous-window ; select-pane -t '{bottom-right}'" 'select-pane -L'
bind -n M-Right if -F '#{pane_at_right}' "next-window ; select-pane -t '{top-left}'"        'select-pane -R'
bind -n M-Up    if -F '#{pane_at_top}'    "run-shell \"sh ~/.local/bin/tmux-nav-session prev '#{client_name}'\"" 'select-pane -U'
bind -n M-Down  if -F '#{pane_at_bottom}' "run-shell \"sh ~/.local/bin/tmux-nav-session next '#{client_name}'\"" 'select-pane -D'
# Ctrl+矢印も同じ (Termius 等 Alt が Esc として届かないクライアント用。
# 標準シーケンス CSI 1;5x なのでアプリを問わず届く。
# 代償としてペイン内アプリの Ctrl+矢印 (単語ジャンプ等) は使えなくなる)
bind -n C-Left  if -F '#{pane_at_left}'  "previous-window ; select-pane -t '{bottom-right}'" 'select-pane -L'
bind -n C-Right if -F '#{pane_at_right}' "next-window ; select-pane -t '{top-left}'"        'select-pane -R'
bind -n C-Up    if -F '#{pane_at_top}'    "run-shell \"sh ~/.local/bin/tmux-nav-session prev '#{client_name}'\"" 'select-pane -U'
bind -n C-Down  if -F '#{pane_at_bottom}' "run-shell \"sh ~/.local/bin/tmux-nav-session next '#{client_name}'\"" 'select-pane -D'
# Alt+hjkl: 実際に一番使うペイン移動 (WezTerm からはそのまま届く。矢印キーは
# WezTerm 側で握られていて tmux まで来ないので、こちらが本命)。
# 端で行き止まりにせず、横軸はタブ (tmux ウィンドウ)、縦軸はセッションへ抜ける:
#   一番左のペインで Alt+h → 前のタブの一番右のペイン
#   一番右のペインで Alt+l → 次のタブの一番左のペイン
#   一番上のペインで Alt+k → 前のセッションの一番下のペイン
#   一番下のペインで Alt+j → 次のセッションの一番上のペイン
# タブ・セッションとも端で巻き戻るので、押し続ければ全部を一周できる。
# 旧仕様: Alt+h/l は端でアプリ (nvim) にキーを透過、Alt+j/k は 1 発でセッション切替。
# 透過は「tmux の端のペインでだけ nvim のウィンドウ移動が効く」という不揃いな挙動
# だったので廃止した (nvim 側は <leader>h/l と Ctrl+Home/End が残っている)。
# 1 発でのセッション切替は prefix + ( / ) に残っている。
bind -n M-h if -F '#{pane_at_left}'   "previous-window ; select-pane -t '{bottom-right}'" 'select-pane -L'
bind -n M-l if -F '#{pane_at_right}'  "next-window ; select-pane -t '{top-left}'"        'select-pane -R'
bind -n M-k if -F '#{pane_at_top}'    "run-shell \"sh ~/.local/bin/tmux-nav-session prev '#{client_name}'\"" 'select-pane -U'
bind -n M-j if -F '#{pane_at_bottom}' "run-shell \"sh ~/.local/bin/tmux-nav-session next '#{client_name}'\"" 'select-pane -D'
# Alt+r / Alt+Shift+r: ペインを次/前に回転して入れ替え (旧 WezTerm の RotatePanes の tmux 版。
# 旧 Alt+n/p から移設: Alt+p はペイン名入力に譲り、Alt+n は空きに戻した)
bind -n M-r rotate-window -D
bind -n M-R rotate-window -U
# Alt+z: ペインのズーム (トグル)。prefix + z も残してあるが、prefix を挟む運指が
# しんどいので 1 打鍵版を用意した (issue #242)
bind -n M-z resize-pane -Z
# prefix + < / > でウィンドウを左右に入れ替え (WezTerm の Alt+,/. からブリッジ)
# ウィンドウ番号が入れ替わるとペイン名・claude セッションの位置キーもズレるため、
# 入れ替え後に保存し直す (prefix + m / M / ! と同じ理由)
bind -r < swap-window -d -t -1 \; run-shell -b "sh ~/.local/bin/wezterm-tabs-sync" \; run-shell -b "sh ~/.local/bin/tmux-resurrect-autosave force"
bind -r > swap-window -d -t +1 \; run-shell -b "sh ~/.local/bin/wezterm-tabs-sync" \; run-shell -b "sh ~/.local/bin/tmux-resurrect-autosave force"
# prefix + H/J/K/L でペインサイズ調整 (-r で連打可。マウスドラッグでも可)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# prefix + r で設定リロード
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# --- ファイラー (yazi ポップアップ) ---
# prefix+f: どのペインにも属さない浮遊ウィンドウ (display-popup) に yazi を開く。
# カレントはアクティブペインの cwd。Enter でファイルを popup 内の nvim で開き、
# q で popup ごと閉じる。WezTerm からは Ctrl+q f (ブリッジ)。
# yazi は ~/.local/bin に手動インストール (26.5.6)。tmux サーバーの PATH には
# ~/.local/bin が無い (yazi: not found で popup が即閉じる) ためフルパスで呼ぶ
bind f popup -E -d "#{pane_current_path}" -w 90% -h 85% "EDITOR=nvim ~/.local/bin/yazi"

# --- URL を開く ---
# prefix+o: 画面 (+ 直近スクロールバック) の URL を fzf ポップアップで選び、
# Windows 側の既定ブラウザで開く。折り返しを結合してから抽出するので、
# Ctrl+クリック (WezTerm の行単位検出) で拾えない複数行 URL もこれで開ける。
# 1 件しか無ければ選択なしで即開く。WezTerm からは Ctrl+q o (ブリッジ)。
# 注意: popup のコマンド文字列はフォーマット展開されない (-d などのオプションのみ
# 展開される) ので、対象ペインはスクリプト側が display-message で解決する。
bind o popup -E -w 80% -h 50% "~/.local/bin/tmux-open-url"

# --- ウィンドウ切替 (WezTerm 以外のクライアント用: iPad/iPhone 等) ---
# Ctrl+Tab は通常の端末プロトコルでは Tab (C-i) と区別できるバイト列を持たない。
# WezTerm では .wezterm.lua が C-b n に変換して送っているため tmux 側は不要だが、
# 拡張キー (modifyOtherKeys / CSI u) 対応クライアント (Blink 等) からは
# C-Tab がそのまま届くので tmux 側でも受ける。
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
bind -n C-Tab next-window
bind -n C-S-Tab previous-window
# Termius は拡張キー非対応で C-Tab を送れないため、標準シーケンスで届く
# 代替キーも用意する。Shift+←/→ = 前/次 (アプリを問わず届く。
# 代償としてペイン内アプリには Shift+矢印が届かなくなる)
bind -n S-Left  previous-window
bind -n S-Right next-window
# Alt+数字 = 直接選択 (WezTerm の Ctrl+数字と同じ並び。Termius は
# 設定で Option を Esc 扱いにすると使える。WezTerm からもそのまま通る)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# --- セッション操作 ---
# セッション切替は Alt+k / Alt+j に統合した (ペイン操作の側に定義がある)。
# 上端/下端のペインまで来てからもう一度押すと前/次のセッションへ抜ける。
# 途中のペインを飛ばして 1 発で移動したいときは prefix + ( / ) を使う。
# prefix + s : セッションのツリーから選んで切り替え (WezTerm は LEADER+s)。
# choose-tree の既定の並びはセッションの作成順 (index) なので、名前順に付けた
# 並び順番号 (01-main 等) と食い違って見える。開いた直後に O (並び替えキー) を
# 送って name 順に切り替える。並び順は Alt+K/J の巡回・list-sessions と一致する。
# ※ tmux 3.4 の choose-tree は -O name を受け取っても無視する (ヘッダーの
#   "sort: index" が変わらない) ため、この O 送信で代用している
bind s choose-tree -Zs \; send-keys O
# prefix + N : 名前を聞いて新規セッションを作り、そのまま移動する (WezTerm は LEADER+n)
bind N command-prompt -p "new session:" "new-session -s '%%'"
# 移動系は小文字/大文字で「ペイン単位/ウィンドウ単位」を対にする (WezTerm は LEADER+m / LEADER+M)。
# prefix + m : 現在のペインを、一覧から選んだウィンドウ (別セッションも可) へ移動する。
# 移動先のウィンドウに合流する形になる。
# ペインの位置 (セッション名/ウィンドウ番号/ペイン番号) が変わると、その位置をキーに
# している pane-names.tsv・claude-sessions.tsv が実態とズレて、次の復元で名前や
# 会話が元の位置に付いてしまう。移動直後に保存し直してズレを残さない。
bind m choose-tree -Zw "join-pane -t '%%' ; run-shell -b 'sh ~/.local/bin/tmux-resurrect-autosave force'"
# prefix + M : 現在のウィンドウを丸ごと、一覧から選んだセッションへ移動して追従する。
# prefix+m がペイン単位なのに対し、こちらはウィンドウ単位でセッション間を移す。
# ウィンドウ名 (= WezTerm タブ名) と各ペインの @name はそのまま維持される。
# choose-tree を開く間にカレントウィンドウが変わっても正しい元ウィンドウを移せるよう、
# 押下時点のウィンドウ ID を @move-window-src に退避してからツリーを開く。
# 実移動・保存し直しは tmux-move-window が行い、クライアントの追従だけ選択後に直接実行する。
bind M run-shell -b "tmux set -gq @move-window-src '#{window_id}'" \; \
  choose-tree -Zs "run-shell 'sh ~/.local/bin/tmux-move-window \"%%\"' ; switch-client -t '%%'" \; \
  send-keys O
# ペインを独立したウィンドウに切り出す場合も同じ理由で保存し直す
bind ! break-pane \; run-shell -b "sh ~/.local/bin/tmux-resurrect-autosave force"

# --- セッションの名前と並び順 (#232) ---
# tmux はセッションを名前の昇順にしか並べないため、並び順は名前の先頭に付けた
# 番号 ("01-main" "02-dotfiles") で決まる。採番・入れ替え・改名は
# tmux-session-order がまとめて面倒を見る (詳細はスクリプト冒頭のコメント)。
# prefix + $ : セッション名を変更する (番号は維持。WezTerm は LEADER+T)。
# 名前の先頭に 1〜2 桁の番号を書くと ("3-main")、その位置へ移してから採番し直す
bind '$' command-prompt -I "#{s/^[0-9][0-9]-//:session_name}" -p "session name (先頭に番号で位置指定):" \
  "run-shell -b \"sh ~/.local/bin/tmux-session-order rename '%%' '#{session_name}'\""
# Alt+< / Alt+> : セッションを並びの前/後ろへ入れ替える (タブ移動 Alt+, / Alt+. のセッション版)。
# ウィンドウ入れ替えと同じく Alt キー直打ちなので、WezTerm 以外のクライアントでも効く
bind -n M-< run-shell -b "sh ~/.local/bin/tmux-session-order move prev '#{session_name}'"
bind -n M-> run-shell -b "sh ~/.local/bin/tmux-session-order move next '#{session_name}'"
# 新しく作られたセッション (prefix+N / tm <名前> / 復元) にも番号を振る。
# 復元中は名前を書き換えると restore.sh のセッション指定が外れるため、
# tmux-session-order 側で復元完了マークが付くまで待つ
set-hook -g session-created 'run-shell -b "sh ~/.local/bin/tmux-session-order renumber"'

# --- コピーモード (vi) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
# コピーは必ず copy-pipe → `tmux load-buffer -w` に通す。
# copy-selection の set-clipboard 経由の OSC 52 は発火しないことがある
# （実測: バッファには入るがクライアントに届かない）が、-w 経路は確実に届く。
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "tmux load-buffer -w -"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "tmux load-buffer -w -"

# --- マウスコピー ---
# ドラッグ選択はボタンを離した瞬間に Windows のクリップボードへ入る
# （Ctrl+Shift+C は不要。押すと WezTerm 側の空選択で上書きされるので注意）。
# ダブルクリック=単語 / トリプルクリック=行 を即コピー。
# 「単語」の区切りはスペースのみ: URL やパス（- @ ? = を含む）を途中で切らず、
# 複数行に折り返していてもダブルクリック一発で全体をコピーできる。
set -g word-separators " "
# nvim などマウスを自前で使うアプリのペインでは、クリックをアプリへそのまま渡す。
bind -n DoubleClick1Pane if -Ft= "#{mouse_any_flag}" "send-keys -M" "copy-mode -M ; send -X select-word ; send -X copy-pipe-and-cancel 'tmux load-buffer -w -'"
bind -n TripleClick1Pane if -Ft= "#{mouse_any_flag}" "send-keys -M" "copy-mode -M ; send -X select-line ; send -X copy-pipe-and-cancel 'tmux load-buffer -w -'"
bind -T copy-mode-vi DoubleClick1Pane send -X select-word \; send -X copy-pipe-and-cancel "tmux load-buffer -w -"
bind -T copy-mode-vi TripleClick1Pane send -X select-line \; send -X copy-pipe-and-cancel "tmux load-buffer -w -"
# prefix + Y: いま画面に見えているペイン全体をまるごとコピー（-J で折り返しを結合）。
# 選択操作なしで「表示中のコード/ログを全部持っていく」ための最終手段。
bind Y run-shell "tmux capture-pane -pJ -t '#{pane_id}' | tmux load-buffer -w -" \; display-message "画面全体をコピーしました"

# --- ペイン名表示 ---
# 各ペインの上辺ボーダーに名前を常時表示し、1 画面のどのペインで何を
# 作業中か一望できるようにする (WezTerm タブ = ウィンドウ名とは別レイヤー)。
# Alt+p (または prefix+T) で手動命名 (@name)。未設定ペインは実行中コマンド名を自動表示。
# 空入力で手動名を解除して自動表示に戻る。
set -g pane-border-format " #{?pane_active,#[fg=#7aa2f7#,bold],#[fg=#565f89]}#P: #{?@name,#{@name},#{pane_current_command}} #[default]"
bind T command-prompt -p "pane name:" "set -p @name '%%'"
bind -n M-p command-prompt -p "pane name:" "set -p @name '%%'"
# 1 ペインだけのウィンドウでは名前バーを出さない (分割/クローズのたびに判定。
# リロード直後の既存ウィンドウは次のレイアウト変化から反映)
set-hook -g window-layout-changed 'set -wF pane-border-status "#{?#{==:#{window_panes},1},off,top}"'

# --- ステータスライン ---
# 下部バーを常時表示し、左下に「アクティブペインの cwd のフルパス + git ブランチ」を出す
# (今どこで・どのブランチで作業中か迷子にならないように。リポジトリ外はパスのみ)。
# パスが長いときは末尾側を優先して先頭を … で省略する (ディレクトリ名が見えるように)。
# タブ (ウィンドウ一覧) は WezTerm のタブバーが担う (#214: 下記の WezTerm 連携フック参照)
# ため WezTerm では出さず、グループセッション (*-view-*: iPad/iPhone 等 WezTerm 以外の
# クライアント。zshrc の tm 参照) のときだけウィンドウ一覧・右下 (セッション名+日時) も表示する
# (矢羽根グリフはモバイルのフォントに無いことが多いので使わない)
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#1f2335,fg=#a9b1d6"
# 一番左は接続表示: 通常は紫の devbox、アクティブペインで ssh 実行中は赤の ssh
# (旧 WezTerm 右上の接続ラベルの移設。続けてパス+ブランチ。緑はブランチ名と被るので使わない)
set -g status-left "#{?#{==:#{pane_current_command},ssh},#[fg=#f7768e#,bold] ssh ,#[fg=#bb9af7#,bold] devbox }#[fg=#7aa2f7,bold] #{s|^/home/azureuser|~|;=|-50|…:pane_current_path} #[fg=#9ece6a,bold]#(sh ~/.local/bin/tmux-git-branch '#{pane_current_path}') "
set -g status-left-length 100
set -g status-right "#{?#{m:*-view-*,#{session_name}},#[fg=#7aa2f7#,bold] #S #[fg=#a9b1d6] %m/%d %H:%M ,}"
setw -g window-status-separator ""
setw -g window-status-format "#{?#{m:*-view-*,#{session_name}}, #I:#W ,}"
setw -g window-status-current-format "#{?#{m:*-view-*,#{session_name}},#[fg=#ffffff#,bg=#ae8b2d#,bold] #I:#W ,}"

# --- WezTerm タブバー連携 ---
# ウィンドウ構成が変わるたびに一覧を SetUserVar で WezTerm へ通知し、
# .wezterm.lua がタブバーに tmux ウィンドウをタブ風に描画する
set-hook -g client-attached        'run-shell -b "sh ~/.local/bin/wezterm-tabs-sync"'
# セッション切替 (prefix+s の choose-tree / prefix+M の追従 switch-client) でも
# タブバーを即更新する。これが無いと次のウィンドウ切替までタブが前セッションのまま
set-hook -g client-session-changed 'run-shell -b "sh ~/.local/bin/wezterm-tabs-sync"'
set-hook -g session-window-changed 'run-shell -b "sh ~/.local/bin/wezterm-tabs-sync"'
set-hook -g window-linked          'run-shell -b "sh ~/.local/bin/wezterm-tabs-sync"'
set-hook -g window-unlinked        'run-shell -b "sh ~/.local/bin/wezterm-tabs-sync"'
set-hook -g after-rename-window    'run-shell -b "sh ~/.local/bin/wezterm-tabs-sync"'

# --- セッション永続化 (tmux-resurrect) ---
# VM の deallocate / 再起動で tmux セッションはメモリごと消えるため、
# ウィンドウ・ペイン構成 + cwd を定期保存し、次回 tmux 起動時に自動復元する。
# 保存は cron が tmux-resurrect-autosave を 15 分ごとに叩く (bootstrap.sh が登録。
# 起動直後の復元が完了するまで保存を保留し、復元素材の上書きを防ぐラッパー)。
# 復元はサーバー起動時に tmux-autorestore が一度だけ実行する
# (以前使っていた tmux-continuum は別サーバー誤検知で不発になるため廃止。
# 経緯はスクリプト冒頭のコメント参照)。
# claude が動いていたペインは、保存しておいた「ペインごとのセッション ID」で
# `claude --resume` し、それぞれ元の会話から再開する (tmux-claude-sessions)。
# 一律 `claude --continue` だと同一 cwd のペインが全部「最新の会話」になってしまう。
# 手動操作: prefix + Ctrl-s = 保存 / prefix + Ctrl-r = 復元
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# rpa セッションの ssh も復元対象にする (#238)。rpa (UiPath 用 Windows Server) へは
# WezTerm のタブから直接ではなく、この tmux セッションの中から入ることで、
# WezTerm を閉じても回線が切れてもセッションが残るようにしている。
#
# 復元は素の ssh ではなくラッパー (~/.local/bin/rpa) に寄せる。素の ssh で戻すと、
# rpa の自動停止 (22:00 / 1時間アイドル) 中に復元がかかったとき ssh が即終了して
# ペインごとセッションが消え、また復元されない状態に戻ってしまうため。
# ※ この構成で tmux に常駐する ssh は rpa 行きだけなので ssh 全体をラッパーに
#    寄せている。他所への ssh を常駐させるようになったらこの行を見直すこと。
set -g @resurrect-processes '"~claude->sh ~/.local/bin/tmux-claude-sessions resume" "~ssh->sh ~/.local/bin/rpa connect"'

# resurrect はペインオプションを保存しないため、ペイン名 (@name。prefix+T で命名し
# ボーダーに表示) はそのままだと再起動で消える。フックで別ファイルに保存・復元する。
# claude のセッション ID も同じタイミングでペイン位置ごとに保存する。
set -g @resurrect-hook-post-save-all 'sh ~/.local/bin/tmux-pane-names save; sh ~/.local/bin/tmux-claude-sessions save'
set -g @resurrect-hook-post-restore-all 'sh ~/.local/bin/tmux-pane-names restore'
run '~/.tmux/plugins/tpm/tpm'
# 手動保存 (prefix + Ctrl-s) も autosave ラッパー経由にする。resurrect 既定の
# バインドは save.sh を直接叩くため、cron 保存と同じ秒に重なると保存ファイルを
# 奪い合い、last が存在しないファイルを指したまま残る (tmux-resurrect-repair-last
# の冒頭コメント参照)。ラッパーなら flock で直列化され、保存後に検算も走る。
bind C-s run-shell "sh ~/.local/bin/tmux-resurrect-autosave force" \; display-message "tmux環境を保存しました"
# サーバー起動直後の一度だけ自動復元 (continuum の代替)
run-shell -b 'sh ~/.local/bin/tmux-autorestore'
